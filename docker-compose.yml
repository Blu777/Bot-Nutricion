services:

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nutrition
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nutrition"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-init:
    image: ghcr.io/blu777/bot-nutricion:latest
    restart: "no"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/nutrition
    command: sh -c "node dist/db/migrate.js && node dist/db/seed/food-dictionary.js"
    depends_on:
      db:
        condition: service_healthy

  api:
    image: ghcr.io/blu777/bot-nutricion:latest
    restart: unless-stopped
    ports:
      - "3090:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/nutrition
      API_BASE_URL: http://api:3000
      API_SECRET: CHANGE_ME
      GEMINI_API_KEY: CHANGE_ME
      GEMINI_MODEL: gemini-2.5-flash-lite
      TELEGRAM_BOT_TOKEN: disabled
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      db-init:
        condition: service_completed_successfully

  bot:
    image: ghcr.io/blu777/bot-nutricion:latest
    restart: unless-stopped
    command: ["node", "dist/bot/standalone.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@db:5432/nutrition
      API_BASE_URL: http://api:3000
      API_SECRET: CHANGE_ME
      GEMINI_API_KEY: CHANGE_ME
      GEMINI_MODEL: gemini-2.5-flash-lite
      TELEGRAM_BOT_TOKEN: CHANGE_ME
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
